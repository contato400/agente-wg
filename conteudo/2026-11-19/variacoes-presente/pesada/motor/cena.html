<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Anton;src:url(__ANTON__)}
html,body{margin:0;background:transparent;overflow:hidden}
#lay{position:absolute;left:0;top:0;width:1080px;height:1920px;perspective:1100px;overflow:hidden}
.el{position:absolute;transform-style:preserve-3d}
.anton{font-family:Anton;text-transform:uppercase;line-height:1}
.ext{color:#ffd21f;text-shadow:1px 1px 0 #c8141b,2px 2px 0 #c8141b,3px 3px 0 #b01016,4px 4px 0 #a00e14,5px 5px 0 #900c12,6px 6px 0 #800a10,7px 7px 0 #70080e,8px 8px 0 #60060c,10px 14px 30px rgba(0,0,0,.7)}
.extw{color:#fff;text-shadow:1px 1px 0 #999,2px 2px 0 #888,3px 3px 0 #777,4px 4px 0 #666,5px 5px 0 #555,6px 6px 0 #444,8px 12px 26px rgba(0,0,0,.75)}
.extr{color:#ff2a2a;text-shadow:1px 1px 0 #8a0a0e,2px 2px 0 #7a080c,3px 3px 0 #6a070b,4px 4px 0 #5a060a,5px 5px 0 #4a0509,6px 6px 0 #3a0408,0 0 40px rgba(255,40,40,.6)}
.card{background:linear-gradient(160deg,#1b1b1b,#070707);border:5px solid #c8141b;border-radius:22px;box-shadow:0 30px 60px rgba(0,0,0,.7),0 0 40px rgba(200,20,27,.55);color:#fff;padding:16px 38px 20px;text-align:center;white-space:nowrap}
.card.y{border-color:#ffd21f;box-shadow:0 30px 60px rgba(0,0,0,.7),0 0 40px rgba(255,210,31,.45)}
.card.b{border-color:#5ab0ff;box-shadow:0 30px 60px rgba(0,0,0,.7),0 0 46px rgba(90,176,255,.55)}
.card.solid{background:#ffd21f;color:#0a0a0a;border-color:#0a0a0a}
.cap{position:absolute;left:110px;right:135px;text-align:center;font-family:'Inter Display';font-weight:900;font-size:68px;line-height:1.05;color:#fff;-webkit-text-stroke:12px #000;paint-order:stroke fill;text-transform:uppercase}
.cap .k{color:#ffd21f}
.band{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:linear-gradient(180deg,#121212,#050505);border-top:6px solid #c8141b;box-shadow:0 -12px 40px rgba(200,20,27,.35)}
.box{font-family:Anton;text-transform:uppercase;line-height:1.05;padding:8px 32px 12px;text-align:center}
.g{background:#119a1d;color:#fff}.r{background:#c8141b;color:#fff}
.outline{color:transparent;-webkit-text-stroke:5px rgba(255,255,255,.85)}
.outline.k{-webkit-text-stroke:6px rgba(10,10,10,.9)}
.outline.r{-webkit-text-stroke:5px rgba(255,60,60,.9);background:none}
.face{position:absolute;left:0;top:0;width:170px;height:170px;background:linear-gradient(135deg,#e01b22,#8f0c10);border:2px solid #5a0508;box-sizing:border-box}
.face:after{content:'';position:absolute;left:70px;top:0;width:30px;height:100%;background:#ffd21f}
.lid{position:absolute;left:-10px;top:-10px;width:190px;height:190px;background:linear-gradient(135deg,#ff2a30,#a50e13);border:2px solid #5a0508;box-sizing:border-box}
.lid:after{content:'';position:absolute;left:80px;top:0;width:30px;height:100%;background:#ffd21f}
.coin{width:210px;height:210px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a0,#ffd21f 45%,#c89400);border:8px solid #c8141b;box-shadow:0 20px 40px rgba(0,0,0,.6),0 0 40px rgba(255,210,31,.5);display:flex;align-items:center;justify-content:center;color:#0a0a0a}
.extk{color:#0a0a0a;text-shadow:1px 1px 0 #ffd21f,2px 2px 0 #e0b800,3px 3px 0 #c8a000,4px 4px 0 #a88400,6px 10px 22px rgba(0,0,0,.45)}
.cc{width:360px;height:226px;border-radius:22px;background:linear-gradient(135deg,#2a2f3a,#0d0f14 60%,#1c2230);border:2px solid #5a6170;box-shadow:0 25px 50px rgba(0,0,0,.7);position:relative;overflow:hidden}
.cc .chip{position:absolute;left:36px;top:70px;width:62px;height:46px;border-radius:8px;background:linear-gradient(135deg,#f7d66b,#b8902a)}
.cc .ln{position:absolute;left:36px;height:14px;border-radius:7px;background:#4a5262}
.xx{position:absolute;left:50%;top:50%;width:300px;height:30px;background:#e0141c;border-radius:15px;box-shadow:0 0 20px rgba(224,20,28,.8)}
.endcard{position:absolute;inset:0;background:#0a0a0a}
</style></head><body>
<div id="lay"></div>
<script>
const CFG = __CFG__;
const lay = document.getElementById('lay');
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x,0,1);return 1-Math.pow(1-x,3)};
const back=x=>{x=clamp(x,0,1);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
function vis(t,e){return t>=e.t0-0.001 && t<e.t1}
const io=(t,e,a=0.15,b=0.25)=>Math.min(clamp((t-e.t0)/a,0,1),clamp((e.t1-t)/b,0,1));
const FX = {
 split(t,e){const p=t-e.t0, a=ease(p/0.45), out=clamp((e.t1-t)/0.25,0,1);
  return e.chars.map((c,i)=>`<div class="el anton ${e.cls||'ext'}" style="left:${e.x[i]}px;top:${e.y}px;font-size:${e.size}px;opacity:${Math.min(a*1.3,out)};transform:translateZ(${-900*(1-a)}px) rotateY(${(i?-1:1)*(28*(1-a)+6*Math.sin(t*1.5))}deg) rotateX(${8*Math.sin(t*1.1+i)}deg)">${c}</div>`).join('')},
 marquee(t,e){const p=t-e.t0;
  return `<div class="el anton outline ${e.cls||''}" style="left:${(e.dir<0? -1400+p*e.speed : 1100-p*e.speed)}px;top:${e.y}px;font-size:${e.size}px;white-space:nowrap;opacity:${io(t,e,0.3,0.3)};transform:rotateY(${e.dir<0?22:-22}deg) rotateZ(-4deg)">${e.text} ${e.text}</div>`},
 card(t,e){const p=t-e.t0, a=back(p/0.5);
  return `<div class="el card ${e.cls||''}" style="left:${e.x||540}px;top:${e.y}px;opacity:${io(t,e)};transform:translateX(-50%) translateZ(${-500*(1-a)}px) rotateX(${e.rx!=null?e.rx*(1-a):0}deg) rotateY(${(e.spin||0)*(1-a)+5*Math.sin(t*1.7)}deg) scale(${0.6+0.4*a})"><div class="anton" style="font-size:${e.size}px">${e.html}</div></div>`},
 big(t,e){const p=t-e.t0, a=ease(p/0.55), q=clamp((t-(e.t1-0.3))/0.3,0,1);
  return `<div class="el anton ${e.cls||'ext'}" style="left:540px;top:${e.y}px;font-size:${e.size}px;white-space:nowrap;opacity:${Math.min(1,p/0.12)*(1-q)};transform:translateX(-50%) translateZ(${-1600*(1-a)+120*q}px) rotateX(${40*(1-a)}deg) rotateY(${4*Math.sin(t*1.3)}deg)">${e.html}</div>`},
 stamp(t,e){const p=t-e.t0, a=ease(p/0.18), sh=p<0.4?Math.sin(p*80)*12*(1-p/0.4):0;
  return `<div class="el card ${e.cls||''}" style="left:${(e.x||540)+sh}px;top:${e.y}px;opacity:${io(t,e,0.06)};transform:translateX(-50%) scale(${2.6-1.6*a}) rotate(${e.rot||-5}deg)"><div class="anton" style="font-size:${e.size}px">${e.html}</div></div>`},
 tilt(t,e){const p=t-e.t0, a=ease(p/0.6);
  return `<div class="el anton ${e.cls||'ext'}" style="left:${e.x}px;top:${e.y}px;font-size:${e.size}px;white-space:nowrap;opacity:${io(t,e,0.3,0.3)};transform:translateX(-50%) translateZ(${-700*(1-a)}px) rotateY(${e.ry||18}deg) rotateX(6deg) translateX(${-(p*e.drift||0)}px)">${e.html}</div>`},
 coin(t,e){const p=t-e.t0, a=back(p/0.5);
  return `<div class="el" style="left:${e.x}px;top:${e.y}px;opacity:${io(t,e)};transform:translateZ(${-600*(1-a)}px) rotateY(${-80*(1-ease(p/0.5))+18*Math.sin(t*2.2)}deg) scale(${0.5+0.5*a})"><div class="coin"><div class="anton" style="font-size:${e.size}px;text-align:center">${e.html}</div></div></div>`},
 ccard(t,e){const p=t-e.t0, a=back(p/0.5), x=ease((t-e.tx)/0.2);
  return `<div class="el" style="left:540px;top:${e.y}px;opacity:${io(t,e)};transform:translateX(-50%) translateZ(${-600*(1-a)}px) rotateY(${-70*(1-a)-12+8*Math.sin(t*1.8)}deg) rotateX(14deg) scale(${e.sc||0.75})"><div class="cc"><div class="chip"></div><div class="ln" style="top:150px;width:240px"></div><div class="ln" style="top:178px;width:140px"></div>
   ${t>=e.tx?`<div class="xx" style="transform:translate(-50%,-50%) rotate(35deg) scaleX(${x})"></div><div class="xx" style="transform:translate(-50%,-50%) rotate(-35deg) scaleX(${x})"></div>`:''}</div></div>`},
 gift(t,e){const p=t-e.t0, a=back(p/0.45), open=ease((p-0.6)/0.35), ry=-35+p*22;
  const f=(tr,sh)=>`<div class="face" style="transform:${tr};filter:brightness(${sh})"></div>`;
  return `<div class="el" style="left:${e.x}px;top:${e.y}px;width:170px;height:170px;opacity:${io(t,e)};transform:translateZ(${-700*(1-a)}px) rotateX(-22deg) rotateY(${ry}deg)">
   ${f('translateZ(85px)',1)}${f('rotateY(180deg) translateZ(85px)',.5)}${f('rotateY(90deg) translateZ(85px)',.65)}${f('rotateY(-90deg) translateZ(85px)',.8)}
   <div class="el" style="left:0;top:0;width:170px;height:170px;transform:translateY(${-200*open}px) rotateZ(${open*-20}deg)">
     <div class="lid" style="transform:rotateX(90deg) translateZ(95px)"></div>
     <div class="lid" style="height:40px;top:-10px;transform:translateZ(95px);filter:brightness(1.1)"></div>
     <div class="lid" style="height:40px;top:-10px;transform:rotateY(90deg) translateZ(95px);filter:brightness(.7)"></div>
     <div class="lid" style="height:40px;top:-10px;transform:rotateY(-90deg) translateZ(95px);filter:brightness(.85)"></div>
   </div></div>
   ${e.notext?"":`<div class="el anton ext" style="left:${e.tx||540}px;top:${e.ty||300}px;font-size:${e.size}px;white-space:nowrap;opacity:${open*io(t,e)};transform:translateX(-50%) scale(${0.4+0.6*open})">${e.html}</div>`}`},
};
function band(){const b=CFG.band; if(!b) return '';
 const body = b.kind==='A' ? `<div class="box g"><div style="font-size:96px">PRESENTE LIBERADO!</div><div style="font-size:60px;color:#0a0a0a">ASSISTA ATÉ O FINAL</div></div>`
   : `<div class="box g" style="font-size:88px">PRESENTE LIBERADO</div><div class="box r" style="font-size:70px">PARCELE NO PIX OU NO CARTÃO</div>`;
 return `<div class="band" style="top:${b.y0}px;height:${b.y1-b.y0}px;padding-bottom:${b.pad||0}px;box-sizing:border-box">${body}</div>`}
function caption(t){for(const g of CFG.caps){if(t>=g[1]&&t<g[2]){return `<div class="cap" style="top:${CFG.capY}px;transform:translateY(-100%)">${g[0]}</div>`}} return ''}
function endcard(t){const p=t-CFG.cardT, a=ease(p/0.25);
 return `<div class="endcard" style="opacity:${Math.min(1,p/0.2)}"></div>
 <div style="position:absolute;left:0;right:0;top:470px;text-align:center;opacity:${a};transform:translateY(${40*(1-a)}px)">
 <div style="display:inline-block;background:#ffd21f;color:#0a0a0a;font-family:Anton;font-size:84px;padding:6px 36px 12px">TOQUE EM SAIBA MAIS</div>
 <div style="font-family:Anton;color:#fff;font-size:118px;line-height:1.05;margin-top:46px">E GARANTA OS<br><span style="color:#ffd21f">23 TREINAMENTOS</span><br>DO MESTRE WESLEY</div>
 <div style="width:220px;height:10px;background:#c8141b;margin:46px auto"></div>
 <div style="font-family:'Inter Display';font-weight:800;color:#fff;font-size:50px;line-height:1.35">1 ano de acesso<br>Certificado ao concluir<br>7 dias de garantia</div>
 <div style="font-family:'Inter Display';font-weight:700;color:#9a9a9a;font-size:32px;margin-top:60px;letter-spacing:1px">MESTRE WESLEY GIMENEZ · KRAV MAGÁ CAVEIRA</div></div>`}
window.render = function(t, layer){
  let h='';
  if(layer==='mid'){ if(!(CFG.cardT && t>=CFG.cardT)) for(const e of CFG.fx) if(e.layer==='bg' && vis(t,e)) h+=FX[e.type](t,e); }
  else if(CFG.cardT && t>=CFG.cardT) h=endcard(t);
  else { for(const e of CFG.fx) if(e.layer==='fg' && vis(t,e)) h+=FX[e.type](t,e); h+=caption(t)+band(); }
  lay.innerHTML=h;
  return h;
};
</script></body></html>
